database_url: "sqlite:///jobradar.db"
user_agent: "JobRadarBot/1.0 (student project; contact: student@university.edu)"
request_timeout: 15
default_request_delay: 2.0
max_requests_per_run: 10
max_pages_per_run: 5
consecutive_misses_for_removal: 2
stale_threshold_multiplier: 2.0
cors_origins:
  - "http://localhost:3000"
  - "http://localhost:5173"
  - "http://localhost:8080"
  - "https://lovable.dev"
snapshot_dir: "snapshots"
fixture_dir: "fixtures"
